<div class="dashboard-container dashboard-component mt-4">
  <div class="dashboard-header">
    <h2>
      <mat-icon>dashboard</mat-icon>
      Tableau de bord
    </h2>
    <p class="dashboard-subtitle">Centre de gestion Terres Fertiles</p>
  </div>

  <!-- Dashboard catégorisé -->
  <div class="categories-container">
    <div *ngFor="let category of categories" class="category-section category-{{ category.name }}">
      <div class="category-header">
        <mat-icon class="category-icon">{{ category.icon }}</mat-icon>
        <div class="category-info">
          <h3>{{ category.title }}</h3>
          <p>{{ category.description }}</p>
        </div>
      </div>
      
      <div class="category-items">
        <mat-card 
          *ngFor="let item of category.items" 
          class="dashboard-card" 
          [routerLink]="item.route">
          <div class="card-header">
            <mat-icon class="item-icon">{{ item.icon }}</mat-icon>
            <div class="card-content">
              <h4>{{ item.title }}</h4>
              <p class="card-description">{{ item.description }}</p>
            </div>
          </div>
        </mat-card>
      </div>
    </div>
  </div>
</div>
